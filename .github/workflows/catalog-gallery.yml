name: Catalog gallery checks

on:
  push:
    paths:
      - 'catalogo-nuovo.html'
      - 'shop-*'
      - 'customer-profile-ui.js'
      - 'scripts/export-shop.py'
      - 'shop-icons/**'
      - 'shop-data/**'
      - 'supabase/functions/vg-shop-catalog/**'
      - 'supabase/functions/vg-shop-push/**'
      - 'tests/catalog-*.cjs'
      - '.github/workflows/catalog-gallery.yml'

permissions:
  contents: read

jobs:
  gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated test dependencies
        run: npm install --prefix "$RUNNER_TEMP/vg-tests" --no-audit --no-fund playwright@1.58.2 jsdom@26.1.0
      - name: Install Chromium
        run: node "$RUNNER_TEMP/vg-tests/node_modules/playwright/cli.js" install --with-deps chromium webkit
      - name: API, DOM and responsive browser checks
        env:
          NODE_PATH: '${{ runner.temp }}/vg-tests/node_modules'
          VG_CATALOG_SCREENSHOTS: '${{ runner.temp }}/vg-catalog-screenshots'
        run: |
          check_status=0
          node --test tests/catalog-export.test.cjs tests/catalog-resource-usage.test.cjs tests/catalog-session-races.test.cjs || check_status=1
          node --test tests/customer-dossier.test.cjs tests/catalog-notices.test.cjs tests/editor-stability.test.cjs tests/save-feedback.test.cjs tests/catalog-promotions.test.cjs tests/catalog-customer.test.cjs tests/catalog-variants.test.cjs tests/catalog-api.test.cjs tests/catalog-access.test.cjs tests/catalog-order.test.cjs tests/catalog-push.test.cjs tests/catalog-registration-push.test.cjs tests/catalog-password-reset.test.cjs || check_status=1
          node tests/catalog-auto-access.test.cjs || check_status=1
          node tests/catalog-navigation.test.cjs || check_status=1
          SHOP_NAV_BROWSER=webkit node tests/catalog-navigation.test.cjs || check_status=1
          node tests/catalog-dom.test.cjs || check_status=1
          node tests/catalog-boutique.test.cjs || check_status=1
          node tests/catalog-boutique-browser.test.cjs || check_status=1
          SHOP_NAV_BROWSER=webkit node tests/catalog-boutique-browser.test.cjs || check_status=1
          node tests/catalog-shipping.test.cjs || check_status=1
          node tests/catalog-feedback.test.cjs || check_status=1
          node tests/catalog-editing.test.cjs || check_status=1
          SHOP_NAV_BROWSER=webkit node tests/catalog-editing.test.cjs || check_status=1
          node tests/catalog-customer-ui.test.cjs || check_status=1
          node tests/catalog-customer-browser.test.cjs || check_status=1
          SHOP_NAV_BROWSER=webkit node tests/catalog-customer-browser.test.cjs || check_status=1
          node tests/catalog-gallery.test.cjs || check_status=1
          node tests/catalog-contact.test.cjs || check_status=1
          exit "$check_status"

      - name: Verify the published catalog (read only)
        if: github.ref == 'refs/heads/main'
        env:
          NODE_PATH: '${{ runner.temp }}/vg-tests/node_modules'
        run: |
          node tests/catalog-live.test.cjs
          # The source-owned deployment for this repository is GitHub Pages.

      - name: Save catalogue screenshots (isolated QA orders)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VG-catalogo-cartoon
          path: '${{ runner.temp }}/vg-catalog-screenshots/*.png'
          if-no-files-found: ignore
