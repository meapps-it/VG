name: Patch and Build Turni Operai v10

on:
  push:
    branches: ["turni-operai"]
    paths:
      - "TurniOperai/tools/patch_v10.py"
      - ".github/workflows/patch-turni-v10.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: turni-operai

      - name: Apply v10 patch
        run: python TurniOperai/tools/patch_v10.py

      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TurniOperai/app/src/main/java/com/meapps/turnioperai/MainActivityV6.kt TurniOperai/app/build.gradle.kts
          git diff --cached --quiet || git commit -m "Turni Operai v10 textile profiles and Android back navigation"
          git push origin turni-operai

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore stable debug signing key
        working-directory: TurniOperai/app
        run: base64 -d turni-operai-debug.jks.b64 > turni-operai-debug.jks

      - name: Build debug APK
        working-directory: TurniOperai
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TurniOperai-v10-debug-apk
          path: TurniOperai/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
