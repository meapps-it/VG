name: Management PWA and hybrid UI
on:
  push:
    paths:
      - 'index.html'
      - 'vg-catalog-stats.*'
      - 'vg-bold-theme.css'
      - 'vg-startup.js'
      - 'tests/management-*.test.cjs'
      - 'tests/article-photos.test.cjs'
      - '.github/workflows/management-ui.yml'
permissions:
  contents: read
jobs:
  responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated browser tools
        run: npm install --prefix "$RUNNER_TEMP/vg-tests" --no-audit --no-fund playwright@1.58.2
      - name: Install Chromium
        run: node "$RUNNER_TEMP/vg-tests/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Verify original dashboard and catalog statistics on mobile and desktop
        env:
          NODE_PATH: '${{ runner.temp }}/vg-tests/node_modules'
          VG_UI_SCREENSHOTS: '${{ runner.temp }}/vg-ui-screenshots'
        run: |
          node --test tests/article-photos.test.cjs tests/article-sync.test.cjs tests/management-cloud.test.cjs
          node --test tests/management-customer-stats.test.cjs tests/management-startup.test.cjs
          node tests/management-ui.test.cjs
          node tests/management-actions.test.cjs
          node tests/management-boot-browser.test.cjs
          node tests/management-publication.test.cjs
      - name: Save verified layout screenshots (isolated example data)
        uses: actions/upload-artifact@v4
        with:
          name: VG-layout-0.8.1
          path: '${{ runner.temp }}/vg-ui-screenshots/*.png'
          if-no-files-found: error
