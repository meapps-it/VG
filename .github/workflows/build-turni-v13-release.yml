name: Build Turni Operai v13 Release

on:
  push:
    branches: [turni-operai]
    paths:
      - 'TurniOperai/**'
      - '.github/workflows/build-turni-v13-release.yml'
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build unsigned release
        working-directory: TurniOperai
        run: chmod +x gradlew && ./gradlew assembleRelease --stacktrace

      - name: Upload unsigned release
        uses: actions/upload-artifact@v4
        with:
          name: TurniOperai-v13-unsigned
          path: TurniOperai/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
