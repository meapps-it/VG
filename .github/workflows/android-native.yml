name: Android native CI

on:
  push:
    branches: [main]
    paths:
      - "android-native/**"
      - ".github/workflows/android-native.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Prepare Android SDK
        run: |
          SDK_ROOT="$RUNNER_TEMP/android-sdk"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip -o "$RUNNER_TEMP/android-tools.zip"
          unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$RUNNER_TEMP/android-tools"
          mkdir -p "$SDK_ROOT/cmdline-tools/latest"
          mv "$RUNNER_TEMP/android-tools/cmdline-tools/"* "$SDK_ROOT/cmdline-tools/latest/"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Prepare Gradle wrapper
        run: chmod +x gradlew
      - name: Restore stable test signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: vg-android-debug-keystore-v1
      - name: Unit test
        run: ./gradlew :app:testDebugUnitTest
      - name: Android lint
        run: ./gradlew :app:lintDebug
      - name: Build APK
        run: ./gradlew :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gestionale-Android-0.3.1-debug
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
