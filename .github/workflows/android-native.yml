name: Android native CI

on:
  push:
    branches: [main, feature/vg-hybrid]
    paths:
      - "android-native/**"
      - ".github/workflows/android-native.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Prepare Android SDK
        run: |
          SDK_ROOT="$RUNNER_TEMP/android-sdk"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip -o "$RUNNER_TEMP/android-tools.zip"
          unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$RUNNER_TEMP/android-tools"
          mkdir -p "$SDK_ROOT/cmdline-tools/latest"
          mv "$RUNNER_TEMP/android-tools/cmdline-tools/"* "$SDK_ROOT/cmdline-tools/latest/"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Prepare Gradle wrapper
        run: chmod +x gradlew
      - name: Restore deterministic test signing key
        run: |
          base64 -d ci/debug.keystore.b64 > ci/debug.keystore
          chmod 600 ci/debug.keystore
      - name: Unit test
        run: ./gradlew :app:testVgDebugUnitTest
      - name: Android lint
        run: ./gradlew :app:lintVgDebug
      - name: Build APK
        run: ./gradlew :app:assembleVgDebug
      - name: Verify fixed test signing identity
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs app/build/outputs/apk/vg/debug/app-vg-debug.apk > "$RUNNER_TEMP/vg-signature.txt"
          cat "$RUNNER_TEMP/vg-signature.txt"
          python3 ci/verify-test-signature.py "$RUNNER_TEMP/vg-signature.txt"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated browser test tools
        run: npm install --prefix "$RUNNER_TEMP/vg-tests" --no-audit --no-fund playwright@1.58.2
      - name: Install test browser
        run: node "$RUNNER_TEMP/vg-tests/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Appearance and existing management regression checks
        working-directory: .
        env:
          NODE_PATH: '${{ runner.temp }}/vg-tests/node_modules'
        run: |
          node tests/quality-pricing.test.cjs
          node --test tests/article-sync.test.cjs
          node tests/article-autofill.test.cjs
          node tests/android-appearance.test.cjs
          node tests/management-ui.test.cjs
          node tests/management-actions.test.cjs
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 35 real WebView, native font, slider, persistence and install smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: android-native
          script: |
            ./gradlew :app:connectedVgDebugAndroidTest
            adb install -r -t app/build/outputs/apk/vg/debug/app-vg-debug.apk
            adb install -r -t app/build/outputs/apk/androidTest/vg/debug/app-vg-debug-androidTest.apk
            adb shell am instrument -w -e class it.meapps.gestionale.VgAppearanceDeviceTest#persistAcrossProcessStop -e appearancePersistence prepare com.vg.gestionale.seconda.test/androidx.test.runner.AndroidJUnitRunner | tee "$RUNNER_TEMP/vg-persist-prepare.txt"
            grep -q 'OK (1 test)' "$RUNNER_TEMP/vg-persist-prepare.txt"
            adb shell am force-stop com.vg.gestionale.seconda
            adb shell am instrument -w -e class it.meapps.gestionale.VgAppearanceDeviceTest#persistAcrossProcessStop -e appearancePersistence verify com.vg.gestionale.seconda.test/androidx.test.runner.AndroidJUnitRunner | tee "$RUNNER_TEMP/vg-persist-verify.txt"
            grep -q 'OK (1 test)' "$RUNNER_TEMP/vg-persist-verify.txt"
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VG-0.8.9-test-reports
          path: |
            android-native/app/build/reports/
            android-native/app/build/outputs/androidTest-results/
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VG-CI-0.8.9-test-signed
          path: android-native/app/build/outputs/apk/vg/debug/app-vg-debug.apk
          if-no-files-found: error
