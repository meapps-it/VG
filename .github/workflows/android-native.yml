name: Android native CI

on:
  push:
    branches: [main]
    paths:
      - "android-native/**"
      - ".github/workflows/android-native.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Prepare Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Prepare Gradle wrapper
        run: chmod +x gradlew
      - name: Unit test
        run: ./gradlew :app:testDebugUnitTest
      - name: Android lint
        run: ./gradlew :app:lintDebug
      - name: Build APK
        run: ./gradlew :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gestionale-Android-0.1.0-debug
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
