name: Build Turni Operai APK

on:
  push:
    branches: ["turni-operai"]
    paths:
      - "TurniOperai/**"
      - ".github/workflows/turni-operai-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: TurniOperai
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TurniOperai-debug-apk
          path: TurniOperai/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
