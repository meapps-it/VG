<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gestionale · Licenza SimplexApp</title>
<style>
html,body{margin:0;height:100%;background:#0f172a;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
#appFrame{border:0;width:100%;height:100%;display:block;background:#fff}
#msg{position:fixed;inset:0;z-index:99999;display:grid;place-items:center;padding:22px;background:#0f172ae8}
#msg.hidden{display:none}
.card{width:min(430px,100%);background:#fff;border-radius:22px;padding:24px;box-sizing:border-box;text-align:center;box-shadow:0 24px 70px #0006}
.card h1{font-size:24px;margin:0 0 8px}.card p{color:#5f6b7a;line-height:1.45}
.card input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d7dfeb;border-radius:12px;font-size:16px;margin:8px 0}
.card button{border:0;border-radius:12px;padding:12px 16px;font-weight:800;background:#1978f2;color:#fff}
#bar{position:fixed;left:0;right:0;top:0;z-index:90000;display:none;padding:8px 12px;text-align:center;font-size:12px;font-weight:800;background:#fff3cd;color:#674d00;border-bottom:1px solid #eed27a}
#bar.show{display:block}#bar.ok{background:#e7f7ed;color:#17643b;border-color:#bfe5cb}
</style>
</head>
<body>
<div id="bar"></div>
<div id="msg" class="hidden"><div class="card"><h1 id="title">Attivazione Gestionale</h1><p id="text">Inserisci la chiave licenza associata al cliente.</p><input id="licenseInput" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Chiave licenza"><button id="go">Attiva</button></div></div>
<iframe id="appFrame" src="./index.html" title="Gestionale"></iframe>
<script>
(()=>{'use strict';
const ENDPOINT='https://qfjwtawsqfwmsmrrgqfi.supabase.co/functions/v1/simplex-admin?action=client-config';
const APIKEY='sb_publishable_-EUVjwsk3txKk2Opqrc7Kw_xFNa9Hw1';
const STORE='simplex_gestionale_license_v1';
const MODULES={clienti:['clienti'],ordini:['ordini'],magazzino:['articoli'],statistiche:['finanze']};
const $=id=>document.getElementById(id),frame=$('appFrame'),box=$('msg'),bar=$('bar');

function getKey(){
 const u=new URL(location.href),q=(u.searchParams.get('license')||'').trim().toLowerCase();
 if(/^[a-f0-9]{48}$/.test(q)){localStorage.setItem(STORE,q);u.searchParams.delete('license');history.replaceState(null,'',u.pathname+u.search+u.hash);return q}
 const s=(localStorage.getItem(STORE)||'').trim().toLowerCase();return /^[a-f0-9]{48}$/.test(s)?s:'';
}
function message(title,text,input=true){$('title').textContent=title;$('text').textContent=text;$('licenseInput').style.display=input?'block':'none';$('go').style.display=input?'inline-block':'none';box.classList.remove('hidden')}
function hideMessage(){box.classList.add('hidden')}
function setBar(text,ok=false){bar.textContent=text;bar.className='show'+(ok?' ok':'')}
function hideBar(){bar.className=''}
async function config(key){
 const r=await fetch(ENDPOINT,{method:'POST',cache:'no-store',headers:{'Content-Type':'application/json',apikey:APIKEY},body:JSON.stringify({licenseKey:key})});
 const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Licenza non valida');return d.client;
}
function apply(c){
 const d=frame.contentDocument;if(!d)return;
 for(const [mod,sections] of Object.entries(MODULES)){
   if(!(mod in (c.modules||{})))continue;
   const on=c.modules[mod]===true;
   for(const sec of sections){
     d.querySelectorAll('[data-go="'+sec+'"],[data-tab="'+sec+'"],#sec_'+sec).forEach(el=>{
       el.style.display=on?'':'none';
       el.toggleAttribute('aria-hidden',!on);
     });
   }
 }
}
async function activate(key){
 try{
   const c=await config(key);
   if(c.status==='suspended'){hideBar();message('Licenza sospesa','Questa copia del Gestionale è stata sospesa.',false);return}
   if(c.status==='expired'){hideBar();message('Licenza scaduta','Questa licenza non è più attiva.',false);return}
   hideMessage();
   const run=()=>{try{apply(c)}catch{}};
   if(frame.contentDocument?.readyState==='complete')run(); else frame.addEventListener('load',run,{once:true});
   frame.addEventListener('load',run);
   if(c.status==='demo')setBar('VERSIONE DEMO');
   else hideBar()
   try{
    const obs=new MutationObserver(run);
    frame.addEventListener('load',()=>{try{obs.disconnect();obs.observe(frame.contentDocument.documentElement,{subtree:true,childList:true})}catch{}});
   }catch{}
 }catch(e){hideBar();message('Licenza non verificabile',e.message||'Controllo licenza non riuscito.',true)}
}
$('go').onclick=()=>{const key=$('licenseInput').value.trim().toLowerCase();if(!/^[a-f0-9]{48}$/.test(key)){message('Chiave non valida','Controlla la chiave licenza e riprova.',true);return}localStorage.setItem(STORE,key);activate(key)};
$('licenseInput').addEventListener('keydown',e=>{if(e.key==='Enter')$('go').click()});
const key=getKey();if(key)activate(key);else message('Attivazione Gestionale','Inserisci la chiave licenza associata al cliente.',true);
})();
</script>
</body>
</html>
